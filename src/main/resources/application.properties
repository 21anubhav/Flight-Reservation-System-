# Server configuration
server.port=8080

# Spring MVC & JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Static Resources
spring.web.resources.static-locations=classpath:/static/,/static/

# In-Memory MySQL-compatible H2 database for out-of-the-box zero-setup execution
spring.datasource.url=jdbc:h2:mem:flight_reservation;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.com.deloitte.flight=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=INFO
